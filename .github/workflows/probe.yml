name: probe

on:
  push:
    paths:
      - ".github/probe/**"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/probe.py
      - name: Publish probe results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-log.sh probe probe-out
